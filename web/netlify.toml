# Netlify config for the Media & Software Manager LeadFlow demo site.
# In the Netlify UI set "Base directory" to `web`; paths below are relative to it.

[build]
  publish = "."
  functions = "netlify/functions"

# Form endpoint -> proxy function (docs/ARCHITECTURE.md §5.7)
[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead-proxy"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'"
